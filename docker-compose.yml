services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    container_name: frontend-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev
